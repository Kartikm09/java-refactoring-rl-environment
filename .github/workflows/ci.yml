name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew clean check integrationTest jacocoTestReport spotbugsMain spotbugsTest
      - run: PYTHONPATH=evaluator/src python -m unittest discover -s evaluator/tests -v
      - run: python scripts/validate_repository.py
      - run: python scripts/verify_evaluations.py
