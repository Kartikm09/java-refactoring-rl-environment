name: Release check
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: ./gradlew clean check integrationTest
      - run: python scripts/verify_evaluations.py
